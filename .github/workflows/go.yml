name: Go package

on:
  push:
    paths:
      - "go.mod"
      - "handoff/**"
      - ".github/workflows/go.yml"
  pull_request:
    paths:
      - "go.mod"
      - "handoff/**"
      - ".github/workflows/go.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: gofmt -d -e handoff/*.go
      - run: go test ./...
